<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Miraflores</title>
  
  <!-- Importamos A-Frame (Motor 3D) y MindAR (Motor de rastreo de imágenes) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Componente mejorado para borrar el fondo BLANCO del video
    AFRAME.registerComponent('chromakey', {
      schema: {
        src: { type: 'selector' },
        // Color a borrar: Blanco (Red=1, Green=1, Blue=1)
        color: { default: '1.0 1.0 1.0' } 
      },
      init: function () {
        const data = this.data;
        const el = this.el;
        
        // Creamos la textura con el video. Se asegura RGBAFormat.
        this.videoTexture = new THREE.VideoTexture(data.src);
        this.videoTexture.minFilter = THREE.LinearFilter;
        this.videoTexture.magFilter = THREE.LinearFilter;
        this.videoTexture.format = THREE.RGBAFormat;

        // Configuramos el Shader (Filtro visual)
        this.material = new THREE.ShaderMaterial({
          uniforms: {
            color: { value: new THREE.Color(0xffffff) }, 
            // Variable de textura correcta
            videoTextureSampler: { value: this.videoTexture }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform vec3 color;
            uniform sampler2D videoTextureSampler;
            varying vec2 vUv;
            void main() {
              vec4 tColor = texture2D(videoTextureSampler, vUv);
              
              // Calcula la diferencia entre el color del pixel y el BLANCO
              float diff = length(tColor.rgb - color.rgb);
              
              // Tolerancia para borrar el blanco (Ajustado para no borrar detalles del diseño)
              float a = smoothstep(0.2, 0.4, diff); 
              
              gl_FragColor = vec4(tColor.rgb, tColor.a * a);
            }
          `,
          transparent: true // Activa la transparencia en A-Frame
        });

        el.getObject3D('mesh').material = this.material;
      },
      // Fuerza a A-Frame a actualizar la textura en cada frame de video.
      tick: function () {
        if (this.material && this.videoTexture) {
            this.videoTexture.needsUpdate = true;
        }
      }
    });

    // Componente para controlar la reproducción del video
    AFRAME.registerComponent('ar-controller', {
      init: function () {
        const target = this.el;
        const video = document.querySelector('#video-amazonia');
        const overlay = document.querySelector('#ui-overlay');
        const startBtn = document.querySelector('#btn-iniciar');
        const audioBtn = document.querySelector('#btn-audio');

        // Desbloqueo inicial requerido por Chrome/Safari
        startBtn.addEventListener('click', () => {
          overlay.style.display = 'none';
          video.play().then(() => {
              video.pause(); 
          }).catch((e) => console.log("Auto-play prevenido: ", e));
        });

        // Control del botón de audio flotante
        audioBtn.addEventListener('click', () => {
          video.muted = !video.muted;
          audioBtn.innerText = video.muted ? "🔊 Activar Audio" : "🔇 Silenciar";
        });

        // Cuando la cámara detecta la imagen impresa
        target.addEventListener('targetFound', event => {
          console.log("¡Imagen encontrada!");
          video.play();
          audioBtn.style.display = 'block'; 
        });

        // Cuando la cámara pierde de vista la imagen
        target.addEventListener('targetLost', event => {
          console.log("Imagen perdida.");
          video.pause();
          audioBtn.style.display = 'none'; 
        });
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #ui-overlay h1 { margin-bottom: 10px; font-size: 24px; }
    #ui-overlay p { margin-bottom: 30px; font-size: 16px; opacity: 0.8; max-width: 300px; }

    .btn-action {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn-action:active { transform: scale(0.95); }

    #btn-audio {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: none; 
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      font-size: 14px;
    }
    
    .mindar-ui-overlay { display: none !important; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h1>Miraflores</h1>
    <p>Toca el botón y apunta tu cámara hacia la ilustración para ver la magia.</p>
    <button id="btn-iniciar" class="btn-action">Empezar Experiencia</button>
  </div>

  <button id="btn-audio" class="btn-action">🔊 Activar Audio</button>

  <a-scene 
    mindar-image="imageTargetSrc: targets_miraflores.mind; filterMinCF:0.001; filterBeta: 0.01;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="video-amazonia" 
             src="miraflores.mp4" 
             preload="auto" 
             autoplay="false" 
             loop="true" 
             muted 
             playsinline 
             webkit-playsinline
             crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" ar-controller>
      
      <!-- AJUSTE CLAVE: Proporciones del plano (16:9) y escala general -->
      <!-- Como tu video es panorámico (16:9), el width debe ser proporcionalmente mayor al height -->
      <!-- Ajustamos la escala para que cubra la imagen base -->
      <a-plane 
        position="0 0 0" 
        width="1.777" height="1"  
        scale="1.0 1.0 1.0"       
        chromakey="src: #video-amazonia"
        material="transparent: true">
      </a-plane>
      
    </a-entity>
  </a-scene>

</body>
</html>
