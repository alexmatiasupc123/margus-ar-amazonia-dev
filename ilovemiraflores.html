<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - I <3 Miraflores</title>
  
  <!-- Importamos A-Frame y MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Componente Shader MULTI-TONO para eliminar el ruido de compresión fucsia
    AFRAME.registerComponent('chromakey', {
      schema: {
        src: { type: 'selector' },
        // Usamos el promedio de los hexas que enviaste: #E04D79 (224, 77, 121)
        color: { default: '0.878 0.302 0.475' } 
      },
      init: function () {
        const data = this.data;
        const el = this.el;
        this.videoEl = data.src;
        
        this.videoTexture = new THREE.VideoTexture(this.videoEl);
        this.videoTexture.minFilter = THREE.LinearFilter;
        this.videoTexture.magFilter = THREE.LinearFilter;
        this.videoTexture.format = THREE.RGBAFormat;

        this.material = new THREE.ShaderMaterial({
          uniforms: {
            color: { value: new THREE.Color(0xe04d79) }, // Color base promedio
            videoTextureSampler: { value: this.videoTexture }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform vec3 color;
            uniform sampler2D videoTextureSampler;
            varying vec2 vUv;
            void main() {
              // Limpiamos los bordes (1%) por si acaso hay líneas
              if (vUv.x < 0.01 || vUv.x > 0.99 || vUv.y < 0.01 || vUv.y > 0.99) {
                discard;
              }

              vec4 tColor = texture2D(videoTextureSampler, vUv);
              
              // Distancia entre el color actual y nuestro fucsia promedio
              float diff = length(tColor.rgb - color.rgb);
              
              // TOLERANCIA EXPANDIDA: 
              // Al ser un fondo ruidoso, necesitamos abarcar más rango (hasta 0.35)
              // Pero mantenemos el límite inferior bajo (0.15) para proteger el naranja del marco
              float a = smoothstep(0.15, 0.35, diff); 
              
              // DESTRUCCIÓN AGRESIVA:
              // Cualquier píxel que sea similar al fondo (hasta un 20% de diferencia), lo destruimos.
              // Esto eliminará esas manchas fucsias sueltas.
              if (a < 0.2) {
                discard;
              }
              
              // Protegemos el diseño: si no se destruyó, lo forzamos a ser 100% sólido
              if (a >= 0.2) {
                 a = 1.0;
              }
              
              gl_FragColor = vec4(tColor.rgb, tColor.a * a);
            }
          `,
          transparent: true
        });

        el.getObject3D('mesh').material = this.material;
      },
      tick: function () {
        if (this.material && this.videoTexture && this.videoEl && !this.videoEl.paused) {
          this.videoTexture.needsUpdate = true;
        }
      }
    });

    // Controlador AR
    AFRAME.registerComponent('ar-controller', {
      init: function () {
        const target = this.el;
        const video = document.querySelector('#video-target');
        const videoPlane = document.querySelector('#video-plane');
        const overlay = document.querySelector('#ui-overlay');
        const startBtn = document.querySelector('#btn-iniciar');

        let isTargetVisible = false;

        const forcePlayVideo = () => {
          if (video && video.paused) {
            video.play().catch(e => console.log("Reintento play:", e));
          }
        };

        startBtn.addEventListener('click', () => {
          overlay.style.display = 'none';
          
          video.muted = false;
          video.defaultMuted = false;
          
          video.play().then(() => {
            console.log("Video activo y sonido habilitado.");
          }).catch((err) => {
            console.warn("Autoplay en espera: ", err);
          });
        });

        target.addEventListener('targetFound', () => {
          console.log("¡Imagen encontrada!");
          isTargetVisible = true;
          videoPlane.setAttribute('visible', true);
          forcePlayVideo();
        });

        target.addEventListener('targetLost', () => {
          console.log("Imagen fuera de cuadro.");
          isTargetVisible = false;
          videoPlane.setAttribute('visible', false);
        });

        this.tick = function () {
          if (isTargetVisible && video && video.paused) {
            forcePlayVideo();
          }
        };
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #ui-overlay h1 { margin: 0 0 12px 0; font-size: 24px; font-weight: 700; }
    #ui-overlay p { margin: 0 0 32px 0; font-size: 15px; opacity: 0.85; max-width: 290px; line-height: 1.4; }

    .btn-action {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 50px;
      box-shadow: 0 6px 20px rgba(46, 204, 113, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
    }
    .btn-action:active { 
      transform: scale(0.96); 
      box-shadow: 0 2px 10px rgba(46, 204, 113, 0.2);
    }
    
    .mindar-ui-overlay { display: none !important; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <h1>I <3 Miraflores</h1>
    <p>Toca el botón y apunta tu cámara hacia la ilustración para ver la animación.</p>
    <button id="btn-iniciar" class="btn-action">Empezar Experiencia</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets_ilovemiraflores.mind; filterMinCF:0.001; filterBeta: 0.01;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="video-target" 
             src="./ilovemiraflores.mp4" 
             preload="auto" 
             loop="true" 
             playsinline 
             webkit-playsinline
             crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" ar-controller>
      
      <a-plane 
        id="video-plane"
        position="0 0 0" 
        width="1" height="1.777"  
        scale="1.1 1.1 1.1"       
        chromakey="src: #video-target"
        material="transparent: true"
        visible="false">
      </a-plane>
      
    </a-entity>
  </a-scene>

</body>
</html>
